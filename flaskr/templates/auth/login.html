{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Логин</label>
  <input name="username" id="username" maxlength="100" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
  <label for="password">Пароль</label>
  <input type="password" name="password" id="password" maxlength="128" autocomplete="current-password" required>
  <button>Войти</button>
</form>
{% endblock %}
